services:
  - type: web
    name: sigma-diagnostic-booking
    runtime: docker
    plan: starter
    healthCheckPath: /api/public
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
    disk:
      name: sigma-data
      mountPath: /app/data
      sizeGB: 1
